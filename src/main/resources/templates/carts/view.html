<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layouts/head::head('カート登録情報 | ABCD通販サイト')"></head>
<body>
    <header th:replace="layouts/header::header"></header>
    <h3>カート登録情報</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <!--<form th:method="GET" th:action="@{/payment/card}">-->
    <!--<form th:method="GET">!-->
    <form th:method="GET" th:action="@{/payment/card}" th:object="${cartDetailViews}">
        <table class="table">
        <thead>
            <tr>
                <th>購入</th><th>商品名</th><th>税込み価格</th><th>割引後税込み価格</th><th>個数</th><th>小計</th>
            </tr>
        </thead>
        <tbody>
            <th:block th:unless="${cartView} eq null">
                <tr th:each="cartDetailView : ${cartView.cartDetailViews}">
                    <td hidden>[[${cartDetailView.id}]]</td>
                    <td>
                        <input type="checkbox" th:name="cartDetailId" th:value="${cartDetailView.id}" checked>
                    </td>
                    <td>[[${cartDetailView.productName}]]</td>
                    <td>[[${cartDetailView.productPrice}]]</td>
                    <td>[[${cartDetailView.sellingPrice}]]</td>
                    <td>[[${cartDetailView.quantity}]]</td>
                    <td>[[${cartDetailView.subtotal}]]</td>
                </tr>
            </th:block>
        </tbody>
        <tfoot>
            <tr>
                <th class="total">ご注文合計金額</th>
                <tr th:unless="${cartView} eq null">
                    <td><span th:text="${cartView.totalPrice}"></span></td>
                </tr>
                <tr th:if="${cartView} eq null">
                    <td><span th:text="買い物かごに商品が入っていません"></span></td>
                </tr>
            </tr>
        </tfoot>
        </table>
        <div th:unless="${cartView} eq null">
            <input type="submit" value="購入">
        </div>
    </form>
    <!--<input type="submit" name="purchasing" value="購入" th:formaction="@{/payment/card}" th:object="${cartDetails}">!-->
    <form th:method="GET" th:action="@{/product/shopping/index}">
        <input type="submit" value="買い物を続ける">
    </form>
</body>
</html>

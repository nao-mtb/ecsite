<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layouts/head::head('クレジットカード削除 | ABCD通販サイト')"></head>
<body>
    <header th:replace="layouts/header::header"></header>
    <h3>クレジットカード情報を削除</h3>
    <form th:method="delete" th:action="@{/user/profile/credit-card/delete2/{creditCardId}(creditCardId=${creditCardId})}" th:object="${creditCard}">
        <div class="container">
            <input type="hidden" name="source" th:value="${source}">
        </div>
        <div class="container">
            <label for="cardNumber">カード番号</label>
            <input type="text" th:field="*{cardNumber}" readonly>
        </div>
        <div class="container">
            <label for="expMonth">有効期限_月</label>
            <input type="number" th:field="*{expMonth}" readonly>
        </div>
        <div class="container">
            <label for="expYear">有効期限_年</label>
            <input type="number" th:field="*{expYear}" readonly>
        </div>
        <input type="submit" value="削除">
    </form>
    <a th:href="(${source} == 'info' ? @{/user/profile/credit-card/info} : @{/cart/view})">キャンセル</a>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layouts/backoffice-head::head('製品一覧 | ABCD通販サイト')"></head>
<body>
    <header th:replace="layouts/backoffice-header::header"></header>
    <h3>製品一覧</h3>
    <div sec:authorize="hasAnyRole('ADMIN','SYSTEM','CONTENCT')">
        <a th:href="@{/product/backoffice/create}">新規登録</a>
    </div>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th><th>製品番号</th><th>製品名</th><th>説明</th><th>単価</th><th>販売価格</th><th>消費税率</th><th>廃番</th>    
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td>[[${product.id}]]</td>
                <td>[[${product.code}]]</td>
                <td>[[${product.name}]]</td>
                <td>[[${product.info}]]</td>
                <td>[[${product.unitPrice}]]</td>
                <td>[[${product.sellingPrice}]]</td>
                <td>[[${product.tax.rate}]]</td>
                <td>[[${product.discontinuedFlag}]]</td>
                <td sec:authorize="hasAnyRole('ADMIN','SYSTEM','CONTENCT')">
                    <a th:href="@{/product/backoffice/edit/{productId}(productId=${product.id})}">編集</a>&nbsp;
                    <a th:href="@{/product/backoffice/show/{productId}(productId=${product.id})}">削除</a>&nbsp;
                </td>
            </tr>    
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layouts/backoffice-head::head('権限編集 | ABCD通販サイト')"></head>
<body>
    <header th:replace="layouts/backoffice-header::header"></header>
    <h3>権限編集</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <form th:method="patch" th:action="@{/backoffice/update}" th:object="${userAdminForm}">
        <div class="container">
            <label for="id">ID</label>
            <input type="text" th:field="*{id}" readonly>
            <!-- <input type="text" id="id" name="id" th:value="${id}" readonly> -->
        </div>
        <div class="container">
            <label for="lastName">姓</label>
            <input type="text" th:field="*{lastName}" readonly>
        </div>
        <div class="container">
            <label for="firstName">名</label>
            <input type="text" th:field="*{firstName}" readonly>
        </div>
        <div class="container">
            <label for="mail">Email</label>
            <input type="email" th:field="*{mail}" readonly>
        </div>
        <div hidden class="container">
            <label for="birthDate">生年月日</label>
            <input type="hidden" th:field="*{birthDate}">
        </div>
        <div hidden class="container">
            <label for="deleteFlag">有効/無効</label>
            <input type="hidden" th:field="*{deleteFlag}">
        </div>
        <div class="container">
            <select multiple="multiple" name="roleTypes">
                <option th:each = "roleType : ${roleTypes}"
                        th:value="${roleType}"
                        th:text="${roleType}"
                        th:selected="${#lists.contains(userAdminForm.roleUsers,roleType)}">
                </option>
            </select>
        </div>
        <input type="submit" value="更新">
    </form>        
</body>
</html>

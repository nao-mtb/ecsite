<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layouts/backoffice-head::head('顧客検索結果 | ABCD通販サイト')"></head>
<body>
    <header th:replace="layouts/backoffice-header::header"></header>
    <h3>検索結果</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <table class="table">
        <thead>
            <tr>
                <th></th><th>ID</th><th>氏名</th><th>生年月日</th><th>退会済み</th>
            </tr>
        </thead>
        <tbody>
            <th:block th:unless="${#lists.isEmpty(users)}">
                <tr th:each="user : ${users}">
                    <td>
                        <form th:method="post" th:action="@{/backoffice/select/detail}">
                            <input type="hidden" th:name="id" th:value="${user.id}">
                            <button type="submit">詳細データ</button>
                        </form>
                    </td>
                    <td>[[${user.id}]]</td>
                    <td>[[${user.lastName}]]　[[${user.firstName}]]</td>
                    <td>[[${user.birthDate}]]</td>
                    <td>[[${user.deleteFlag}]]</td>
                    <td>
                        <div sec:authorize="hasAnyRole('ADMIN')">
                            <th:block th:if="${user.deleteFlag}==0">
                                <form th:method="patch" th:action="@{/backoffice/withdraw}">
                                    <input type="hidden" th:name="id" th:value="${user.id}">
                                    <button type="submit">退会</button>
                                </form>
                            </th:block>
                        </div>
                    </td>
                </tr>
            </th:block>
            <th:block th:if="${#lists.isEmpty(users)}">
                <span th:text="該当するユーザはいません"></span>
                <a th:href="@{/backoffice/search/customer}">戻る</a>
            </th:block>
        </tbody>
    </table>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layouts/head::head('氏名変更 | ABCD通販サイト')"></head>
<body>
    <header th:replace="layouts/header::header"></header>
    <h3>氏名変更</h3>
    <form th:method="patch" th:action="@{/user/profile/main/update}" th:object="${userCommonForm}">
        <div class="container">
            <label for="lastName">姓</label>
            <input type="text" th:field="*{lastName}" th:errorclass="bg-warning">
            <span th:errors="*{lastName}"></span>
        </div>
        <div class="container">
            <label for="firstName">名</label>
            <input type="text" th:field="*{firstName}" th:errorclass="bg-warning">
        </div>
        <div class="container">
            <label for="mail">Email</label>
            <input type="text" th:field="*{mail}" readonly>
        </div>
        <div class="container">
            <label for="birthDate">生年月日</label>
            <input type="date" th:field="*{birthDate}" readonly>
        </div>
        <input type="submit" value="登録">
    </form>
    
</body>
</html>

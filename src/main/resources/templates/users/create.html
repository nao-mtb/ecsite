<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layouts/head::head('新規会員登録 | ABCD通販サイト')"></head>
<body>
    <header th:replace="layouts/header::header"></header>
    <h3>新規会員登録</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <div th:if="${error}" class="alert alert-danger">[[${error}]]</div>
    <form th:method="post" th:action="@{/user/save}" th:object="${userCreateForm}" novalidate>
    <ul th:if="${#fields.hasErrors('*')}">
        <li th:each="err:${#fields.errors('*')}" th:text="${err}"></li>
    </ul>  
        <div class="container">
            <label for="lastName">姓</label>
            <input type="text" th:field="*{lastName}" th:errorclass="bg-warning">
            <span th:errors="*{lastName}"></span>
        </div>
        <div class="container">
            <label for="firstName">名</label>
            <input type="text" th:field="*{firstName}" th:errorclass="bg-warning">
            <span th:errors="*{firstName}"></span>
        </div>      
        <div class="container">
            <label for="mail">Email</label>
            <input type="email" th:field="*{mail}" th:errorclass="bg-warning">
            <span th:errors="*{mail}"></span>
        </div>      
        <div class="container">
            <label for="birthDate">生年月日</label>
            <input type="date" th:field="*{birthDate}" th:errorclass="bg-warning">
            <span th:errors="*{birthDate}"></span>
        </div>      
        <div class="container">
            <label for="password">パスワード</label>
            <input type="password" th:field="*{password}" th:errorclass="bg-warning">
            <span th:errors="*{password}"></span>
        </div>
        <input type="submit" value="登録">
    </form>
</body>
</html>

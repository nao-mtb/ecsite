<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">    
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <h3>検索結果</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th><th>氏名</th><th>Email</th><th>保有権限</th>
            </tr>
        </thead>
        <tbody>
            <th:block th:unless="${#lists.isEmpty(users)}">
                <tr th:each="user : ${users}">
                    <td>[[${user.id}]]</td>
                    <td>[[${user.lastName}]]　[[${user.firstName}]]</td>
                    <td>[[${user.mail}]]</td>
                    <td>
                        <ul>
                            <li th:each="roleUser : ${user.roleUsers}" th:text="${roleUser.role.roleType}"></li>
                        </ul>
                    </td>
                    <td>
                        <div sec:authorize="hasAnyRole('ADMIN')">
                            <th:block th:if="${user.deleteFlag}==0">
                                <form th:method="post" th:action="@{/user/admin/edit}">
                                    <input type="hidden" th:name="id" th:value="${user.id}">
                                    <button type="submit">権限編集</button>
                                </form>
                                <form th:method="patch" th:action="@{/user/admin/leave}">
                                    <input type="hidden" th:name="id" th:value="${user.id}">
                                    <button type="submit">退職</button>
                                </form>
                            </th:block>
                        </div>
                        <div sec:authorize="hasRole('SYSTEM') and !hasRole('ADMIN')">
                            <th:block th:if="${user.deleteFlag}==0">
                                <form th:method="patch" th:action="@{/user/admin/leave}">
                                    <input type="hidden" th:name="id" th:value="${user.id}">
                                    <button type="submit">退職</button>
                                </form>
                            </th:block>
                        </div>
                        <div sec:authorize="hasRole('SYSTEM')">
                            <th:block th:unless="${user.deleteFlag}==0">
                                <form th:method="patch" th:action="@{/user/admin/re-entry}">
                                    <input type="hidden" th:name="id" th:value="${user.id}">
                                    <button type="submit">再登録</button>
                                </form>
                            </th:block>
                        </div>
                    </td>
                </tr>    
            </th:block>
            <th:block th:if="${#lists.isEmpty(users)}">
                <span th:text="該当するユーザはいません"></span>
                <a th:href="@{/user/admin/search/member}">戻る</a>
            </th:block>
        </tbody>
    </table>
</body>
</html>

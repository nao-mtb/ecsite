<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">    
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <div th:replace="layouts/header::header"></div>    
    <h3>ユーザ検索</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <form th:method="post" th:action="@{/user/admin/result/customer/list}" novalidate>
        <div class="container">
            <label for="roleId"></label>
            <input type="hidden" id="roleId" name="roleId" th:value="${role.id}">
        </div>
        <div class="container">
            <label for="lastName">姓</label>
            <input type="text" name="lastName">
        </div>
        <div class="container">
            <label for="lastName">名</label>
            <input type="text" name="firstName">
        </div>
        <input type="submit" value="検索">
    </form>
    </div>
</body>
</html>

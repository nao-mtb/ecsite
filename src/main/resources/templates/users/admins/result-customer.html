<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">    
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <h3>検索結果</h3>
    <div th:if="${success}" class="alert alert-success">[[${success}]]</div>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th><th>氏名</th><th>生年月日</th><th>退会</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td><a th:href="@{/user/admin/result/detail/{id}(id=${user.id})}">[[${user.id}]]</a></td>
                <td>[[${user.lastName}]]　[[${user.firstName}]]</td>
                <td>[[${user.birthDate}]]</td>
                <td>[[${user.deleteFlag}]]</td>
                <td>
                    <div sec:authorize="hasAnyRole('ADMIN')">
                        <a th:href="@{/user/admin/edit/{id}(id=${user.id})}">編集</a>&nbsp;
                        <a th:href="@{/user/admin/show/{id}(id=${user.id})}">削除</a>&nbsp;
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>

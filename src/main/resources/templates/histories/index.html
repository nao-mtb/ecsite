<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layouts/head::head('購入履歴 | ABCD通販サイト')"></head>
<body>
    <header th:replace="layouts/header::header"></header>
    <h3>購入履歴</h3>
    <form th:method="GET" th:action="@{/order-history/index}">
        <table class="table">
        <th:block th:if="${#lists.size(orderDetails) > 0}">
            <thead>
                <tr>
                    <th></th><th>購入商品名</th><th>販売金額(外税)</th><th>注文個数</th><th>小計</th><th>注文日</th>
                </tr>
            </thead>        
            <tbody>
                <div th:with="currentId=${orderDetails[0].order.id}">
                    <div th:each="orderDetail, iterStat : ${orderDetails}"
                        th:with="previousId=${iterStat.index == 0 ? currentId : orderDetails[iterStat.index - 1].order.id}">
                        <th:block th:if="${orderDetail.order.id != previousId}">
                            <tr>
                                <td colspan="6"></td>
                            </tr>
                        </th:block>
                        <tr>
                            <td>[[${orderDetail.order.id}]]</td>
                            <td>[[${orderDetail.product.name}]]</td>
                            <td><span th:text="${orderDetail.purchasePrice}"></span></td>
                            <td>[[${orderDetail.quantity}]]</td>
                            <td><span th:text="${orderDetail.purchasePrice} * ${orderDetail.quantity}"></span></td>
                            <td><span th:text="${#dates.format(orderDetail.order.createdAt, 'yyyy-M-d')}"></span></td>
                        </tr>
                    </div>
                </div>
            </tbody>
        </th:block>
        <th:block th:if="${#lists.size(orderDetails) == 0}">
            <span th:text="購入履歴はありません"></span>
        </th:block>
    </table>
    </form>
</body>
</html>
